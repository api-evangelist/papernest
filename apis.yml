name: Papernest
description: 'Papernest is a French technology company, founded in 2015 and headquartered in Paris, that
  provides a digital platform for managing, switching, and cancelling household subscriptions — energy,
  telecom and internet, mobile plans, and home insurance — through a single interface. Built around the
  moment people move home, the service is free to end users and monetized through commissions from
  supplier partners across France, Spain, Italy, and the UK, having helped more than 3 million customers.
  Papernest does not publish a public developer API; it runs a private B2B partner integration program
  and maintains an official GitHub organization of archived open-source utilities.'
